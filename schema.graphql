}

"""
One search across companies, contacts, projects and tasks. Each group is
capped server-side; `*Count` carries the true total so the client can say
"showing N of M" without a second round trip. See NEEDED_SCHEMA_CHANGES.md §5.
"""
type SearchResults {
  companies: [Company!]!
  companiesCount: Int!
  contacts: [Contact!]!
  contactsCount: Int!
  projects: [Project!]!
  projectsCount: Int!
  tasks: [Task!]!
  tasksCount: Int!
}

"""
A company flagged for retention attention, with the reasons already computed
server-side. See NEEDED_SCHEMA_CHANGES.md §9.3 for the thresholds this is
built from and why they should move to org settings.
"""
type AtRiskCompany {
  company: Company!
  reasons: [AtRiskReason!]!
  overdueTouchpointCount: Int!
  "Most recent completed touchpoint. Null if the company has never had one."
  lastTouchpointAt: DateTime
  activeEnrollments: [SequenceEnrollment!]!
}

enum AtRiskReason {
  LOW_HEALTH_SCORE
  OVERDUE_TOUCHPOINTS
  NO_RECENT_CONTACT
}

type SequenceEnrollment {
  id: ID!
