"""
Local stub of the FastAPI + Strawberry GraphQL contract.

Query/Mutation roots are reproduced verbatim from Section 5 of
frontend-implementation-prompt.md. Everything else (object shapes, inputs,
enums) is inferred from the data model in Section 6 of the master plan.
Assumptions are tracked in NEEDED_SCHEMA_CHANGES.md.

Delete this file once NEXT_PUBLIC_GRAPHQL_URL points at the real /graphql.
"""

scalar DateTime
scalar Date
scalar JSON

enum SortDirection {
  ASC
  DESC
}

enum AuthScope {
  INTERNAL
  PORTAL
}

enum UserRole {
  ADMIN
  PROJECT_MANAGER
  TEAM_MEMBER
}

enum UserStatus {
  ACTIVE
  INVITED
  DISABLED
}

enum CompanyStatus {
  LEAD
  ACTIVE
  PAUSED
  CHURNED
}

enum ContactStatus {
  ACTIVE
  INACTIVE
}

enum PreferredChannel {
  EMAIL
  PHONE
  MEETING
}

enum ProjectStatus {
  PLANNING
  ACTIVE
  ON_HOLD
  COMPLETED
  CANCELLED
}

enum ProjectHealth {
  ON_TRACK
  AT_RISK
  DELAYED
}

enum Priority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum PhaseStatus {
  NOT_STARTED
  IN_PROGRESS
  AT_RISK
  COMPLETED
}

enum MilestoneStatus {
  NOT_STARTED
  IN_PROGRESS
  AT_RISK
  COMPLETED
}

enum TaskStatus {
  TODO
  IN_PROGRESS
  REVIEW
  DONE
}

enum DependencyType {
  FINISH_TO_START
  START_TO_START
  FINISH_TO_FINISH
  START_TO_FINISH
}

enum ChangeRequestType {
  SCOPE_ADDITION
  SCOPE_REDUCTION
  TIMELINE_CHANGE
  BUDGET_CHANGE
  BUGFIX
  OTHER
}

enum ChangeRequestStatus {
  SUBMITTED
  UNDER_REVIEW
  PENDING_IMPACT_ASSESSMENT
  PENDING_APPROVAL
  APPROVED
  REJECTED
  ON_HOLD
  IN_PROGRESS
  IMPLEMENTED
  CLOSED
}

enum ApprovalOutcome {
  APPROVED
  REJECTED
}

enum ApprovalStatus {
  PENDING
  APPROVED
  REJECTED
}

enum ApproverType {
