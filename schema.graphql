  PAUSED
  COMPLETED
  CANCELLED
}

enum TouchpointStatus {
  SCHEDULED
  COMPLETED
  SKIPPED
  OVERDUE
}

enum TouchpointOutcome {
  POSITIVE
  NEUTRAL
  AT_RISK
}

