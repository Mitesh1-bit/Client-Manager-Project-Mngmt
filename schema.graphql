type Query {
  notifications(unreadOnly: Boolean, limit: Int, offset: Int): [NotificationType!]!
  unreadNotificationCount: Int!
  activityLogs(
    entityType: String
    actorId: ID
    startAt: DateTime
    endAt: DateTime
    limit: Int
    offset: Int
  ): [ActivityLog!]!
  activityLogsCount(entityType: String, actorId: ID, startAt: DateTime, endAt: DateTime): Int!
  organizationSettings: OrgSettingsType!
  workload(projectId: ID): [WorkloadRow!]!
  company(id: ID!): Company
  companies(filter: CompanyFilter, page: PageInput): CompanyConnection!
  project(id: ID!): Project
  projects(filter: ProjectFilter, page: PageInput): ProjectConnection!
  """
  Kept for compatibility with the original contract. The org-wide queue uses
  `changeRequestQueue` instead — see NEEDED_SCHEMA_CHANGES.md §8.1.
  """
  changeRequests(projectId: ID, status: ChangeRequestStatus): [ChangeRequest!]!
  retentionSequences: [RetentionSequence!]!
  me: User

  # Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §5.
  tags: [Tag!]!
  companySizes: [CompanySize!]!
  industries: [Industry!]!
  users: [User!]!
  search(query: String!): SearchResults!

  # Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §8.
  changeRequest(id: ID!): ChangeRequest
  changeRequestQueue(
    filter: ChangeRequestFilter
    page: PageInput
  ): ChangeRequestConnection!

  # Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §9.
  retentionSequence(id: ID!): RetentionSequence

  """
  Companies flagged for retention attention, pre-filtered and reasoned
  server-side rather than fetched in bulk and filtered in the client — the
  same shape gap 2.3 (dashboardMetrics) asks for elsewhere. See §9.3.
  """
  atRiskCompanies: [AtRiskCompany!]!
}

type Mutation {
  markNotificationRead(id: ID!): NotificationType!
  markAllNotificationsRead: Boolean!
  updateOrganizationSettings(
    healthWeightProjectHealth: Float
    healthWeightTouchpoints: Float
    healthWeightChangeRequests: Float
    healthWeightContract: Float
    healthWeightCompanyStatus: Float
    healthAtRiskThreshold: Float
    contractRenewalWindowDays: Int
    crInternalApprovalCostThreshold: Float
    crInternalApprovalTimelineDaysThreshold: Int
    crRevisionCap: Int
    crResponseSlaDays: Int
  ): OrgSettingsType!
  createCompany(input: CompanyInput!): Company!
  updateCompany(id: ID!, input: CompanyInput!): Company!
  createProject(input: ProjectInput!): Project!
  createTask(input: TaskInput!): Task!
  createMilestone(input: MilestoneInput!): Milestone!
  createChangeRequest(input: ChangeRequestInput!): ChangeRequest!
  assessChangeRequest(id: ID!, input: ImpactAssessmentInput!): ChangeRequest!
  decideChangeRequest(id: ID!, decision: ChangeRequestDecision!): ChangeRequest!
  enrollInSequence(sequenceId: ID!, companyId: ID!): SequenceEnrollment!
  logTouchpoint(input: TouchpointInput!): Touchpoint!
  login(email: String!, password: String!): AuthPayload!
  refreshToken: AuthPayload!
  logout: Boolean!

  # Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §5.
  createContact(input: ContactInput!): Contact!
  updateContact(id: ID!, input: ContactInput!): Contact!
  archiveContact(id: ID!): Contact!

  # Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §6.
  updateProject(id: ID!, input: ProjectInput!): Project!
  updateTask(id: ID!, input: TaskInput!): Task!
  updateMilestone(id: ID!, input: MilestoneInput!): Milestone!
  createPhase(input: PhaseInput!): ProjectPhase!
  updatePhase(id: ID!, input: PhaseInput!): ProjectPhase!
  addProjectMember(projectId: ID!, userId: ID!): User!
  removeProjectMember(projectId: ID!, userId: ID!): Boolean!
  addProjectContact(projectId: ID!, contactId: ID!): Contact!
  removeProjectContact(projectId: ID!, contactId: ID!): Boolean!

  """
  The Kanban drop write, and the inline status control in the list view.

  `orderIndex` is the task's position among its siblings after the move: its
  slot in the destination status column for a top-level task, its slot within
  its parent for a subtask. The server reindexes every affected sibling group
  and returns each task it touched, so the client can reconcile its optimistic
  order in a single cache write.
  """
  updateTaskStatus(id: ID!, status: TaskStatus!, orderIndex: Int!): [Task!]!

  addTaskDependency(
    taskId: ID!
    dependsOnTaskId: ID!
    type: DependencyType! = FINISH_TO_START
  ): Task!
  removeTaskDependency(id: ID!): Task!

  # Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §7.

  """
  Records a decision on a milestone that requires sign-off.

  `id` is the **milestone** id, mirroring `decideChangeRequest`. The server
  resolves which pending `Approval` row the decision belongs to from
  `decision.approverType` plus the caller's identity. See §7.1 — taking the
  approval id instead would be less ambiguous.
  """
  decideMilestoneApproval(id: ID!, decision: ApprovalDecision!): Milestone!

  """
  Step one of a presigned upload: the client asks for somewhere to PUT the
  file, then calls `confirmUpload` once the transfer finishes.
  """
  requestUploadUrl(input: UploadRequestInput!): UploadTicket!
  confirmUpload(input: ConfirmUploadInput!): Document!
  deleteDocument(id: ID!): Boolean!

  # Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §8.

  "The clarification thread on a change request. Closes gap 2.8."
  addComment(input: CommentInput!): Comment!

  """
  Moves a change request along its lifecycle for transitions that aren't an
  assessment or a decision — picking it up, parking it, marking it built.
  The server is expected to reject transitions that aren't legal from the
  current status; see §8.2 for the state machine the UI assumes.
  """
  updateChangeRequestStatus(
    id: ID!
    status: ChangeRequestStatus!
    note: String
  ): ChangeRequest!

  "Routes a request to the PM who will assess it."
  assignChangeRequest(id: ID!, assignedPmId: ID): ChangeRequest!

  "Client-side cancellation, before a decision has been made."
  withdrawChangeRequest(id: ID!, reason: String): ChangeRequest!

  # Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §9.

  "Persists what the sequence builder creates. See §9.1."
  createRetentionSequence(input: RetentionSequenceInput!): RetentionSequence!
  updateRetentionSequence(id: ID!, input: RetentionSequenceInput!): RetentionSequence!

  """
  Marks a scheduled touchpoint — whether logged manually with a future date or
  generated by enrolling a company in a sequence — as done. If it fulfils the
  enrollment's current step, the enrollment advances; if it was the last step,
  the enrollment completes. See §9.2.
  """
