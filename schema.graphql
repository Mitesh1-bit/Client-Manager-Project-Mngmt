}

# Added by the frontend — see NEEDED_SCHEMA_CHANGES.md §9.1.
input RetentionSequenceStepInput {
  name: String!
  channel: SequenceChannel!
  "Days after enrollment this step fires. Steps must be non-decreasing in this value — see §9.1."
