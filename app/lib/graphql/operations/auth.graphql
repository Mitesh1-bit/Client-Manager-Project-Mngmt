fragment ViewerFields on ViewerType {
  id
  name
  email
  role
  status
  avatarUrl
  scope
  organization {
    id
    name
    plan
    logoUrl
  }
  company {
    id
    name
    logoUrl
    status
  }
  contact {
    id
    firstName
    lastName
    title
    isPrimary
  }
}

query Me {
  me {
    ...ViewerFields
  }
}

mutation Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    accessToken
    requires2fa
    challengeToken
  }
}

mutation Signup(
  $organizationName: String!
  $fullName: String!
  $email: String!
  $password: String!
) {
  signup(
    organizationName: $organizationName
    fullName: $fullName
    email: $email
    password: $password
  ) {
    accessToken
    requires2fa
    challengeToken
  }
}

mutation RefreshToken {
  refreshToken {
    accessToken
    requires2fa
    challengeToken
  }
}

mutation Logout {
  logout
}
