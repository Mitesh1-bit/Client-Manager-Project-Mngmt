fragment TagFields on TagType {
  id
  name
}

fragment UserSummaryFields on UserSummaryType {
  id
  name
  email
  role
  avatarUrl
}

fragment ContactFields on ContactType {
  id
  companyId
  firstName
  lastName
  email
  phone
  title
  department
  isPrimary
  preferredChannel
  timezone
  portalAccessEnabled
  linkedinUrl
  status
}

fragment CompanyRow on CompanyType {
  id
  name
  industry
  status
  healthScore
  logoUrl
  contactCount
  projectCount
  accountOwner {
    ...UserSummaryFields
  }
  primaryContact {
    id
    firstName
    lastName
    email
    isPrimary
  }
}

fragment CompanyHeader on CompanyType {
  id
  name
  industry
  website
  logoUrl
  status
  healthScore
  accountOwner {
    ...UserSummaryFields
  }
}

query CompanyList {
  companies {
    ...CompanyRow
  }
}

query CompanyDetailHeader($id: ID!) {
  company(id: $id) {
    ...CompanyHeader
  }
}

query CompanyOverview($id: ID!) {
  company(id: $id) {
    id
    name
    industry
    website
    size
    timezone
    address
    status
    healthScore
    accountOwner {
      ...UserSummaryFields
    }
    primaryContact {
      ...ContactFields
    }
  }
  contracts(companyId: $id) {
    id
    startDate
    endDate
    value
    autoRenew
    status
  }
}

query CompanyContacts($id: ID!) {
  company(id: $id) {
    id
    name
    contacts {
      ...ContactFields
    }
  }
}

query CompanyProjects($id: ID!) {
  company(id: $id) {
    id
    name
  }
  projects(companyId: $id) {
    id
    name
    status
    health
    priority
    budget
    actualCost
    currency
    projectManagerId
  }
}

query CompanyForEdit($id: ID!) {
  company(id: $id) {
    id
    name
    industry
    website
    logoUrl
    size
    timezone
    address
    status
    accountOwner {
      id
    }
  }
}

query CompanyFormOptions {
  users {
    ...UserSummaryFields
  }
  tags {
    ...TagFields
  }
  companySizes {
    id
    label
  }
  industries {
    id
    name
  }
}

mutation CreateCompany(
  $name: String!
  $industry: String
  $website: String
  $logoUrl: String
  $size: String
  $timezone: String
  $address: JSON
  $status: String!
  $accountOwnerId: ID
  $healthScore: Float
) {
  createCompany(
    name: $name
    industry: $industry
    website: $website
    logoUrl: $logoUrl
    size: $size
    timezone: $timezone
    address: $address
    status: $status
    accountOwnerId: $accountOwnerId
    healthScore: $healthScore
  ) {
    ...CompanyRow
  }
}

mutation UpdateCompany(
  $id: ID!
  $name: String
  $industry: String
  $website: String
  $logoUrl: String
  $size: String
  $timezone: String
  $address: JSON
  $status: String
  $accountOwnerId: ID
  $healthScore: Float
) {
  updateCompany(
    id: $id
    name: $name
    industry: $industry
    website: $website
    logoUrl: $logoUrl
    size: $size
    timezone: $timezone
    address: $address
    status: $status
    accountOwnerId: $accountOwnerId
    healthScore: $healthScore
  ) {
    ...CompanyRow
    ...CompanyHeader
  }
}

mutation CreateContact(
  $companyId: ID!
  $firstName: String!
  $lastName: String!
  $email: String
  $phone: String
  $title: String
  $department: String
  $isPrimary: Boolean!
  $preferredChannel: String
  $timezone: String
  $portalAccessEnabled: Boolean!
  $portalPassword: String
  $linkedinUrl: String
  $status: String!
) {
  createContact(
    companyId: $companyId
    firstName: $firstName
    lastName: $lastName
    email: $email
    phone: $phone
    title: $title
    department: $department
    isPrimary: $isPrimary
    preferredChannel: $preferredChannel
    timezone: $timezone
    portalAccessEnabled: $portalAccessEnabled
    portalPassword: $portalPassword
    linkedinUrl: $linkedinUrl
    status: $status
  ) {
    ...ContactFields
  }
}

mutation UpdateContact(
  $id: ID!
  $firstName: String
  $lastName: String
  $email: String
  $phone: String
  $title: String
  $department: String
  $isPrimary: Boolean
  $preferredChannel: String
  $timezone: String
  $portalAccessEnabled: Boolean
  $portalPassword: String
  $linkedinUrl: String
  $status: String
) {
  updateContact(
    id: $id
    firstName: $firstName
    lastName: $lastName
    email: $email
    phone: $phone
    title: $title
    department: $department
    isPrimary: $isPrimary
    preferredChannel: $preferredChannel
    timezone: $timezone
    portalAccessEnabled: $portalAccessEnabled
    portalPassword: $portalPassword
    linkedinUrl: $linkedinUrl
    status: $status
  ) {
    ...ContactFields
  }
}

mutation SetContactPortalPassword($id: ID!, $password: String!) {
  setContactPortalPassword(id: $id, password: $password) {
    id
    portalAccessEnabled
  }
}

mutation ArchiveContact($id: ID!) {
  deleteContact(id: $id)
}

query CompanyTouchpointContext($id: ID!) {
  company(id: $id) {
    id
    name
    contacts {
      id
      firstName
      lastName
      email
      isPrimary
    }
  }
}

query CompanyDocuments($companyId: ID!) {
  companyDocuments(companyId: $companyId) {
    id
    fileUrl
    version
    uploadedBy
  }
}

query CompanyTouchpoints {
  upcomingTouchpoints {
    id
    type
    status
    outcome
    notes
    scheduledAt
    completedAt
    companyId
    contactId
  }
}
