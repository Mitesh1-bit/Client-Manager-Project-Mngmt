query Search($query: String!) {
  search(query: $query) {
    companies {
      id
      name
      industry
      logoUrl
      status
    }
    companiesCount
    contacts {
      id
      companyId
      firstName
      lastName
      email
      title
    }
    contactsCount
    projects {
      id
      name
      status
      health
      companyId
    }
    projectsCount
    tasks {
      id
      title
      status
      priority
      projectId
    }
    tasksCount
  }
}
