fragment RetentionSequenceRow on RetentionSequenceType {
  id
  name
  description
  triggerType
  isActive
  isTemplate
  status
  source
  companyId
  createdAt
  approvedAt
  rejectionReason
  aiRationale
  activeEnrollmentCount
  company {
    id
    name
  }
  createdBy {
    id
    name
  }
  approvedBy {
    id
    name
  }
}

fragment RetentionSequenceStepRow on SequenceStepType {
  id
  stepOrder
  channel
  offsetDays
  templateId
  assigneeRole
  name
  actionMessage
}

query RetentionFormOptions {
  retentionSequences(activeOnly: true) {
    id
    name
    isActive
    status
    companyId
  }
  companies {
    id
    name
    contacts {
      id
      firstName
      lastName
      isPrimary
    }
  }
}

query RetentionSequences(
  $activeOnly: Boolean!
  $companyId: ID
  $status: String
  $source: String
  $createdById: ID
  $createdAfter: DateTime
  $createdBefore: DateTime
  $search: String
) {
  retentionSequences(
    activeOnly: $activeOnly
    companyId: $companyId
    status: $status
    source: $source
    createdById: $createdById
    createdAfter: $createdAfter
    createdBefore: $createdBefore
    search: $search
  ) {
    ...RetentionSequenceRow
    steps {
      id
      stepOrder
      channel
      offsetDays
      name
    }
  }
}

query RetentionSequenceDetail($id: ID!) {
  retentionSequence(id: $id) {
    ...RetentionSequenceRow
    steps {
      ...RetentionSequenceStepRow
    }
    enrollments {
      id
      status
      currentStep
      enrolledAt
      company {
        id
        name
        healthScore
      }
      contact {
        id
        firstName
        lastName
      }
    }
  }
}

query AtRiskDashboard {
  atRiskCompanies {
    company {
      id
      name
      status
      healthScore
      industry
      accountOwner {
        id
        name
      }
      primaryContact {
        id
        firstName
        lastName
        phone
      }
      contacts {
        id
        firstName
        lastName
        isPrimary
      }
    }
    reasons
    overdueTouchpointCount
    lastTouchpointAt
    activeEnrollments {
      id
      sequence {
        id
        name
      }
    }
  }
  upcomingTouchpoints {
    id
    type
    status
    scheduledAt
    companyId
    contactId
  }
}

query UpcomingTouchpoints {
  upcomingTouchpoints {
    id
    type
    status
    outcome
    notes
    scheduledAt
    completedAt
    companyId
    contactId
  }
}

mutation EnrollInSequence(
  $sequenceId: ID!
  $companyId: ID!
  $contactId: ID!
  $projectId: ID
) {
  enrollInSequence(
    sequenceId: $sequenceId
    companyId: $companyId
    contactId: $contactId
    projectId: $projectId
  ) {
    id
    sequenceId
    companyId
    contactId
    status
    currentStep
  }
}

mutation CompleteTouchpoint($id: ID!, $outcome: String, $notes: String) {
  completeTouchpoint(id: $id, outcome: $outcome, notes: $notes) {
    id
    status
    outcome
    notes
    completedAt
  }
}

mutation CancelEnrollment($enrollmentId: ID!) {
  cancelEnrollment(enrollmentId: $enrollmentId) {
    id
    status
  }
}

mutation CreateRetentionSequence(
  $name: String!
  $companyId: ID!
  $triggerType: String!
  $description: String
  $isTemplate: Boolean!
  $submitForApproval: Boolean!
) {
  createRetentionSequence(
    name: $name
    companyId: $companyId
    triggerType: $triggerType
    description: $description
    isTemplate: $isTemplate
    submitForApproval: $submitForApproval
  ) {
    ...RetentionSequenceRow
  }
}

mutation GenerateRetentionSequence($companyId: ID!) {
  generateRetentionSequence(companyId: $companyId) {
    ...RetentionSequenceRow
    steps {
      ...RetentionSequenceStepRow
    }
  }
}

mutation SubmitRetentionSequence($id: ID!) {
  submitRetentionSequence(id: $id) {
    ...RetentionSequenceRow
  }
}

mutation ApproveRetentionSequence($id: ID!) {
  approveRetentionSequence(id: $id) {
    ...RetentionSequenceRow
  }
}

mutation RejectRetentionSequence($id: ID!, $reason: String) {
  rejectRetentionSequence(id: $id, reason: $reason) {
    ...RetentionSequenceRow
  }
}

mutation DuplicateRetentionSequence($sequenceId: ID!) {
  duplicateRetentionSequence(sequenceId: $sequenceId) {
    ...RetentionSequenceRow
  }
}

mutation UpdateRetentionSequence(
  $id: ID!
  $name: String
  $triggerType: String
  $description: String
  $companyId: ID
  $isActive: Boolean
) {
  updateRetentionSequence(
    id: $id
    name: $name
    triggerType: $triggerType
    description: $description
    companyId: $companyId
    isActive: $isActive
  ) {
    ...RetentionSequenceRow
  }
}

mutation RemoveSequenceStep($stepId: ID!) {
  removeSequenceStep(stepId: $stepId)
}

mutation AddSequenceStep(
  $sequenceId: ID!
  $channel: String!
  $offsetDays: Int!
  $templateId: ID
  $assigneeRole: String
  $name: String
  $actionMessage: String
) {
  addSequenceStep(
    sequenceId: $sequenceId
    channel: $channel
    offsetDays: $offsetDays
    templateId: $templateId
    assigneeRole: $assigneeRole
    name: $name
    actionMessage: $actionMessage
  ) {
    ...RetentionSequenceStepRow
  }
}

mutation UpdateSequenceStep(
  $stepId: ID!
  $channel: String
  $offsetDays: Int
  $assigneeRole: String
  $name: String
  $actionMessage: String
) {
  updateSequenceStep(
    stepId: $stepId
    channel: $channel
    offsetDays: $offsetDays
    assigneeRole: $assigneeRole
    name: $name
    actionMessage: $actionMessage
  ) {
    ...RetentionSequenceStepRow
  }
}

mutation ReorderSequenceSteps($sequenceId: ID!, $orderedStepIds: [ID!]!) {
  reorderSequenceSteps(sequenceId: $sequenceId, orderedStepIds: $orderedStepIds) {
    id
    stepOrder
  }
}
