fragment RetentionSequenceRow on RetentionSequenceType {
  id
  name
  triggerType
  isActive
  isTemplate
  activeEnrollmentCount
}

query RetentionFormOptions {
  retentionSequences(activeOnly: false) {
    id
    name
    isActive
  }
  companies {
    id
    name
    contacts {
      id
      firstName
      lastName
      isPrimary
    }
  }
}

query RetentionSequences($activeOnly: Boolean!) {
  retentionSequences(activeOnly: $activeOnly) {
    ...RetentionSequenceRow
    steps {
      id
      stepOrder
      channel
      offsetDays
    }
  }
}

query RetentionSequenceDetail($id: ID!) {
  retentionSequence(id: $id) {
    ...RetentionSequenceRow
    steps {
      id
      stepOrder
      channel
      offsetDays
      templateId
      assigneeRole
    }
    enrollments {
      id
      status
      currentStep
      enrolledAt
      company {
        id
        name
        healthScore
      }
      contact {
        id
        firstName
        lastName
      }
    }
  }
}

query AtRiskDashboard {
  atRiskCompanies {
    company {
      id
      name
      status
      healthScore
      industry
      accountOwner {
        id
        name
      }
      primaryContact {
        id
        firstName
        lastName
        phone
      }
      contacts {
        id
        firstName
        lastName
        isPrimary
      }
    }
    reasons
    overdueTouchpointCount
    lastTouchpointAt
    activeEnrollments {
      id
      sequence {
        id
        name
      }
    }
  }
  upcomingTouchpoints {
    id
    type
    status
    scheduledAt
    companyId
    contactId
  }
}

query UpcomingTouchpoints {
  upcomingTouchpoints {
    id
    type
    status
    outcome
    notes
    scheduledAt
    completedAt
    companyId
    contactId
  }
}

mutation EnrollInSequence(
  $sequenceId: ID!
  $companyId: ID!
  $contactId: ID!
  $projectId: ID
) {
  enrollInSequence(
    sequenceId: $sequenceId
    companyId: $companyId
    contactId: $contactId
    projectId: $projectId
  ) {
    id
    sequenceId
    companyId
    contactId
    status
    currentStep
  }
}

mutation CompleteTouchpoint($id: ID!, $outcome: String, $notes: String) {
  completeTouchpoint(id: $id, outcome: $outcome, notes: $notes) {
    id
    status
    outcome
    notes
    completedAt
  }
}

mutation CancelEnrollment($enrollmentId: ID!) {
  cancelEnrollment(enrollmentId: $enrollmentId) {
    id
    status
  }
}

mutation CreateRetentionSequence($name: String!, $triggerType: String!, $isTemplate: Boolean!) {
  createRetentionSequence(name: $name, triggerType: $triggerType, isTemplate: $isTemplate) {
    ...RetentionSequenceRow
  }
}

mutation UpdateRetentionSequence($id: ID!, $name: String, $triggerType: String, $isActive: Boolean) {
  updateRetentionSequence(id: $id, name: $name, triggerType: $triggerType, isActive: $isActive) {
    ...RetentionSequenceRow
  }
}

mutation RemoveSequenceStep($stepId: ID!) {
  removeSequenceStep(stepId: $stepId)
}

mutation AddSequenceStep(
  $sequenceId: ID!
  $channel: String!
  $offsetDays: Int!
  $templateId: ID
  $assigneeRole: String
) {
  addSequenceStep(
    sequenceId: $sequenceId
    channel: $channel
    offsetDays: $offsetDays
    templateId: $templateId
    assigneeRole: $assigneeRole
  ) {
    id
    stepOrder
    channel
    offsetDays
    templateId
    assigneeRole
  }
}
