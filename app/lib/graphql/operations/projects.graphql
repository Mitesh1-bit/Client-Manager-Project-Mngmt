fragment TagFields on TagType {
  id
  name
}

fragment UserSummaryFields on UserSummaryType {
  id
  name
  email
  role
  avatarUrl
}

fragment ProjectRow on ProjectType {
  id
  name
  status
  health
  priority
  budget
  actualCost
  companyId
  projectManagerId
}

fragment ProjectHeader on ProjectType {
  id
  name
  description
  status
  health
  priority
  budget
  actualCost
  companyId
  projectManagerId
}

fragment PhaseFields on PhaseType {
  id
  projectId
  name
  orderIndex
  status
}

fragment MilestoneFields on MilestoneType {
  id
  phaseId
  title
  status
  orderIndex
}

fragment TaskFields on TaskType {
  id
  projectId
  phaseId
  milestoneId
  parentTaskId
  title
  description
  assigneeId
  status
  priority
  estimatedHours
  actualHours
  subtasks {
    id
    title
    status
    assigneeId
    parentTaskId
  }
  dependencies {
    id
    type
    dependsOnTaskId
  }
}

query ProjectList($companyId: ID) {
  projects(companyId: $companyId) {
    ...ProjectRow
  }
  companies {
    id
    name
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectDetailHeader($id: ID!) {
  project(id: $id) {
    ...ProjectHeader
  }
  companies {
    id
    name
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectPlan($id: ID!) {
  project(id: $id) {
    id
    name
    phases {
      ...PhaseFields
      milestones {
        ...MilestoneFields
      }
      tasks {
        ...TaskFields
      }
    }
    tasks {
      ...TaskFields
    }
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectBoard($id: ID!) {
  project(id: $id) {
    id
    name
    tasks {
      ...TaskFields
    }
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectFormOptions {
  companies {
    id
    name
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectForEdit($id: ID!) {
  project(id: $id) {
    ...ProjectHeader
  }
}

mutation CreateProject(
  $companyId: ID!
  $name: String!
  $description: String
  $status: String!
  $priority: String
  $projectManagerId: ID
  $budget: Float
  $health: String
) {
  createProject(
    companyId: $companyId
    name: $name
    description: $description
    status: $status
    priority: $priority
    projectManagerId: $projectManagerId
    budget: $budget
    health: $health
  ) {
    ...ProjectRow
  }
}

mutation UpdateProject(
  $id: ID!
  $name: String
  $description: String
  $status: String
  $priority: String
  $budget: Float
  $health: String
) {
  updateProject(
    id: $id
    name: $name
    description: $description
    status: $status
    priority: $priority
    budget: $budget
    health: $health
  ) {
    ...ProjectHeader
  }
}

mutation CreatePhase($projectId: ID!, $name: String!, $orderIndex: Int!, $status: String!) {
  createPhase(projectId: $projectId, name: $name, orderIndex: $orderIndex, status: $status) {
    ...PhaseFields
  }
}

mutation UpdatePhase($id: ID!, $name: String, $orderIndex: Int, $status: String) {
  updatePhase(id: $id, name: $name, orderIndex: $orderIndex, status: $status) {
    ...PhaseFields
  }
}

mutation CreateMilestone(
  $phaseId: ID!
  $title: String!
  $orderIndex: Int!
  $status: String!
) {
  createMilestone(phaseId: $phaseId, title: $title, orderIndex: $orderIndex, status: $status) {
    ...MilestoneFields
  }
}

mutation UpdateMilestone($id: ID!, $title: String, $orderIndex: Int, $status: String) {
  updateMilestone(id: $id, title: $title, orderIndex: $orderIndex, status: $status) {
    ...MilestoneFields
  }
}

mutation CreateTask(
  $projectId: ID!
  $phaseId: ID!
  $title: String!
  $milestoneId: ID
  $parentTaskId: ID
  $assigneeId: ID
  $status: String!
  $priority: String!
  $estimatedHours: Float
) {
  createTask(
    projectId: $projectId
    phaseId: $phaseId
    title: $title
    milestoneId: $milestoneId
    parentTaskId: $parentTaskId
    assigneeId: $assigneeId
    status: $status
    priority: $priority
    estimatedHours: $estimatedHours
  ) {
    ...TaskFields
  }
}

mutation UpdateTask(
  $id: ID!
  $title: String
  $status: String
  $priority: String
  $estimatedHours: Float
  $actualHours: Float
) {
  updateTask(
    id: $id
    title: $title
    status: $status
    priority: $priority
    estimatedHours: $estimatedHours
    actualHours: $actualHours
  ) {
    ...TaskFields
  }
}

mutation UpdateTaskStatus($id: ID!, $status: String!) {
  updateTask(id: $id, status: $status) {
    ...TaskFields
  }
}

mutation AddTaskDependency(
  $projectId: ID!
  $taskId: ID!
  $dependsOnTaskId: ID!
  $type: String!
) {
  addTaskDependency(
    projectId: $projectId
    taskId: $taskId
    dependsOnTaskId: $dependsOnTaskId
    type: $type
  ) {
    id
    taskId
    dependsOnTaskId
    type
  }
}

query ProjectChangeRequests($projectId: ID!) {
  changeRequests(projectId: $projectId) {
    id
    title
    status
    priority
    type
    createdAt
  }
}

query ProjectCalendar($id: ID!) {
  project(id: $id) {
    id
    tasks {
      ...TaskFields
    }
  }
}

query ProjectGantt($id: ID!) {
  project(id: $id) {
    id
    phases {
      ...PhaseFields
      milestones {
        ...MilestoneFields
      }
      tasks {
        ...TaskFields
      }
    }
  }
  users {
    ...UserSummaryFields
  }
}

mutation RemoveTaskDependency($id: ID!) {
  removeTaskDependency(id: $id)
}
