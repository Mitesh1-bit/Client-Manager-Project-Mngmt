fragment TagFields on TagType {
  id
  name
}

fragment UserSummaryFields on UserSummaryType {
  id
  name
  email
  role
  jobTitle
  avatarUrl
}

fragment ProjectRow on ProjectType {
  id
  name
  status
  health
  priority
  budget
  actualCost
  currency
  companyId
  startDate
  endDate
  completionPercent
  projectManagerId
  projectManager {
    id
    name
    avatarUrl
  }
  tags {
    ...TagFields
  }
}

fragment ProjectHeader on ProjectType {
  id
  name
  description
  status
  health
  priority
  budget
  actualCost
  currency
  companyId
  startDate
  endDate
  completionPercent
  projectManagerId
  projectManager {
    id
    name
    avatarUrl
  }
  members {
    ...UserSummaryFields
  }
  tags {
    ...TagFields
  }
}

fragment PhaseFields on PhaseType {
  id
  projectId
  name
  orderIndex
  status
  startDate
  dueDate
}

fragment MilestoneFields on MilestoneType {
  id
  phaseId
  title
  description
  status
  orderIndex
  requiresClientApproval
  dueDate
  approvedAt
  approvals {
    id
    approverType
    status
    approverName
  }
  tasks {
    id
    status
  }
}

fragment TaskFields on TaskType {
  id
  projectId
  phaseId
  milestoneId
  parentTaskId
  changeRequestId
  title
  description
  assigneeId
  assignee {
    id
    name
    role
    jobTitle
    avatarUrl
  }
  status
  priority
  estimatedHours
  actualHours
  startDate
  dueDate
  subtasks {
    id
    title
    status
    assigneeId
    assignee {
      id
      name
      role
      jobTitle
      avatarUrl
    }
    parentTaskId
  }
  dependencies {
    id
    type
    dependsOnTaskId
  }
}

query ProjectList($companyId: ID) {
  projects(companyId: $companyId) {
    ...ProjectRow
  }
  companies {
    id
    name
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectDetailHeader($id: ID!) {
  project(id: $id) {
    ...ProjectHeader
  }
  companies {
    id
    name
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectPlan($id: ID!) {
  project(id: $id) {
    id
    name
    phases {
      ...PhaseFields
      milestones {
        ...MilestoneFields
      }
      tasks {
        ...TaskFields
      }
    }
    tasks {
      ...TaskFields
    }
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectBoard($id: ID!) {
  project(id: $id) {
    id
    name
    tasks {
      ...TaskFields
    }
  }
  users {
    ...UserSummaryFields
  }
}

query ProjectFormOptions {
  companies {
    id
    name
  }
  users {
    ...UserSummaryFields
  }
  tags {
    ...TagFields
  }
}

query ProjectForEdit($id: ID!) {
  project(id: $id) {
    ...ProjectHeader
  }
}

mutation CreateProject(
  $companyId: ID!
  $name: String!
  $description: String
  $status: String!
  $priority: String
  $projectManagerId: ID
  $startDate: Date
  $endDate: Date
  $budget: Float
  $actualCost: Float
  $currency: String
  $health: String
) {
  createProject(
    companyId: $companyId
    name: $name
    description: $description
    status: $status
    priority: $priority
    projectManagerId: $projectManagerId
    startDate: $startDate
    endDate: $endDate
    budget: $budget
    actualCost: $actualCost
    currency: $currency
    health: $health
  ) {
    ...ProjectRow
  }
}

mutation UpdateProject(
  $id: ID!
  $name: String
  $description: String
  $status: String
  $priority: String
  $projectManagerId: ID
  $startDate: Date
  $endDate: Date
  $budget: Float
  $actualCost: Float
  $currency: String
  $health: String
) {
  updateProject(
    id: $id
    name: $name
    description: $description
    status: $status
    priority: $priority
    projectManagerId: $projectManagerId
    startDate: $startDate
    endDate: $endDate
    budget: $budget
    actualCost: $actualCost
    currency: $currency
    health: $health
  ) {
    ...ProjectHeader
  }
}

mutation CreatePhase(
  $projectId: ID!
  $name: String!
  $orderIndex: Int!
  $status: String!
  $startDate: Date
  $dueDate: Date
) {
  createPhase(
    projectId: $projectId
    name: $name
    orderIndex: $orderIndex
    status: $status
    startDate: $startDate
    dueDate: $dueDate
  ) {
    ...PhaseFields
  }
}

mutation UpdatePhase(
  $id: ID!
  $name: String
  $orderIndex: Int
  $status: String
  $startDate: Date
  $dueDate: Date
) {
  updatePhase(id: $id, name: $name, orderIndex: $orderIndex, status: $status, startDate: $startDate, dueDate: $dueDate) {
    ...PhaseFields
  }
}

mutation CreateMilestone(
  $phaseId: ID!
  $title: String!
  $orderIndex: Int!
  $status: String!
  $description: String
  $dueDate: Date
  $requiresClientApproval: Boolean
) {
  createMilestone(
    phaseId: $phaseId
    title: $title
    orderIndex: $orderIndex
    status: $status
    description: $description
    dueDate: $dueDate
    requiresClientApproval: $requiresClientApproval
  ) {
    ...MilestoneFields
  }
}

mutation UpdateMilestone(
  $id: ID!
  $title: String
  $orderIndex: Int
  $status: String
  $description: String
  $dueDate: Date
  $requiresClientApproval: Boolean
) {
  updateMilestone(
    id: $id
    title: $title
    orderIndex: $orderIndex
    status: $status
    description: $description
    dueDate: $dueDate
    requiresClientApproval: $requiresClientApproval
  ) {
    ...MilestoneFields
  }
}

mutation MarkMilestoneReadyForReview($milestoneId: ID!) {
  markMilestoneReadyForReview(milestoneId: $milestoneId) {
    id
    status
  }
}

mutation CreateTask(
  $projectId: ID!
  $phaseId: ID!
  $title: String!
  $milestoneId: ID
  $parentTaskId: ID
  $changeRequestId: ID
  $description: String
  $assigneeId: ID
  $status: String!
  $priority: String!
  $startDate: Date
  $dueDate: Date
  $estimatedHours: Float
) {
  createTask(
    projectId: $projectId
    phaseId: $phaseId
    title: $title
    milestoneId: $milestoneId
    parentTaskId: $parentTaskId
    changeRequestId: $changeRequestId
    description: $description
    assigneeId: $assigneeId
    status: $status
    priority: $priority
    startDate: $startDate
    dueDate: $dueDate
    estimatedHours: $estimatedHours
  ) {
    ...TaskFields
  }
}

mutation UpdateTask(
  $id: ID!
  $title: String
  $description: String
  $status: String
  $priority: String
  $phaseId: ID
  $milestoneId: ID
  $parentTaskId: ID
  $assigneeId: ID
  $startDate: Date
  $dueDate: Date
  $estimatedHours: Float
  $actualHours: Float
) {
  updateTask(
    id: $id
    title: $title
    description: $description
    status: $status
    priority: $priority
    phaseId: $phaseId
    milestoneId: $milestoneId
    parentTaskId: $parentTaskId
    assigneeId: $assigneeId
    startDate: $startDate
    dueDate: $dueDate
    estimatedHours: $estimatedHours
    actualHours: $actualHours
  ) {
    ...TaskFields
  }
}

mutation UpdateTaskStatus($id: ID!, $status: String!) {
  updateTask(id: $id, status: $status) {
    ...TaskFields
  }
}

mutation AddTaskDependency(
  $projectId: ID!
  $taskId: ID!
  $dependsOnTaskId: ID!
  $type: String!
) {
  addTaskDependency(
    projectId: $projectId
    taskId: $taskId
    dependsOnTaskId: $dependsOnTaskId
    type: $type
  ) {
    id
    taskId
    dependsOnTaskId
    type
  }
}

query ProjectTeam($id: ID!) {
  project(id: $id) {
    id
    name
    companyId
    members {
      ...UserSummaryFields
    }
    clientContacts {
      id
      firstName
      lastName
      email
      title
      isPrimary
    }
    company {
      id
      contacts {
        id
        firstName
        lastName
        email
        title
        isPrimary
      }
    }
  }
  users {
    ...UserSummaryFields
  }
}

mutation AddProjectMember($projectId: ID!, $userId: ID!) {
  addProjectMember(projectId: $projectId, userId: $userId) {
    ...UserSummaryFields
  }
}

mutation RemoveProjectMember($projectId: ID!, $userId: ID!) {
  removeProjectMember(projectId: $projectId, userId: $userId)
}

mutation AddProjectContact($projectId: ID!, $contactId: ID!) {
  addProjectContact(projectId: $projectId, contactId: $contactId) {
    id
    firstName
    lastName
    email
    title
    isPrimary
  }
}

mutation RemoveProjectContact($projectId: ID!, $contactId: ID!) {
  removeProjectContact(projectId: $projectId, contactId: $contactId)
}

query ProjectChangeRequests($projectId: ID!) {
  changeRequests(projectId: $projectId) {
    id
    title
    status
    priority
    type
    createdAt
  }
}

query ProjectCalendar($id: ID!) {
  project(id: $id) {
    id
    tasks {
      ...TaskFields
    }
  }
}

query ProjectGantt($id: ID!) {
  project(id: $id) {
    id
    phases {
      ...PhaseFields
      milestones {
        ...MilestoneFields
      }
      tasks {
        ...TaskFields
      }
    }
  }
  users {
    ...UserSummaryFields
  }
}

mutation RemoveTaskDependency($id: ID!) {
  removeTaskDependency(id: $id)
}

query ProjectDocuments($projectId: ID!) {
  documents(entityType: "project", entityId: $projectId) {
    id
    entityType
    entityId
    fileUrl
    version
    uploadedBy
  }
}

mutation RequestProjectUploadUrl($entityId: ID!, $filename: String!, $contentType: String!) {
  requestUploadUrl(
    entityType: "project"
    entityId: $entityId
    filename: $filename
    contentType: $contentType
  ) {
    uploadUrl
    uploadToken
    fileUrl
  }
}

mutation ConfirmProjectUpload($entityId: ID!, $fileUrl: String!) {
  confirmUpload(entityType: "project", entityId: $entityId, fileUrl: $fileUrl) {
    id
    fileUrl
    version
  }
}

mutation DeleteDocument($id: ID!) {
  deleteDocument(id: $id)
}
