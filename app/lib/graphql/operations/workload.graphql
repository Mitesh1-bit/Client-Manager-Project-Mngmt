query Workload($projectId: ID) {
  workload(projectId: $projectId) {
    assigneeId
    totalEstimatedHours
    totalActualHours
    openTaskCount
    projectCount
    clientCount
    projectIds
    clientIds
  }
  users {
    ...UserSummaryFields
  }
  projects {
    id
    name
    companyId
  }
  companies {
    id
    name
  }
}
