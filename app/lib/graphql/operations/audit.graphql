query AuditLog(
  $entityType: String
  $actorId: ID
  $startAt: DateTime
  $endAt: DateTime
  $limit: Int
  $offset: Int
) {
  activityLogs(
    entityType: $entityType
    actorId: $actorId
    startAt: $startAt
    endAt: $endAt
    limit: $limit
    offset: $offset
  ) {
    id
    actorId
    action
    entityType
    entityId
    diff
    createdAt
  }
  users {
    ...UserSummaryFields
  }
}
