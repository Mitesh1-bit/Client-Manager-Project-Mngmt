query FoundationSummary {
  companies(page: { pageSize: 100 }) {
    totalCount
    nodes {
      id
      name
      status
      healthScore
    }
  }
  projects(page: { pageSize: 100 }) {
    totalCount
    nodes {
      id
      name
      status
      health
    }
  }
  changeRequests {
    id
    status
  }
}
