query FoundationSummary {
  companies {
    id
    name
    status
    healthScore
  }
  projects {
    id
    name
    status
    health
    priority
    completionPercent
    endDate
    projectManager {
      id
      name
      avatarUrl
    }
  }
  changeRequestDashboard {
    openCount
    pendingApprovalCount
    overdueCount
  }
}
