fragment PortalProjectRow on PortalProjectType {
  id
  name
  status
  health
  description
  startDate
  endDate
  completionPercent
  projectManager {
    id
    name
    email
  }
}

fragment PortalMilestoneFields on MilestoneType {
  id
  title
  description
  status
  dueDate
  approvedAt
  requiresClientApproval
  approvals {
    id
    approverType
    status
    comment
    decidedAt
    approverName
  }
}

fragment PortalChangeRequestFields on ChangeRequestType {
  id
  projectId
  companyId
  title
  type
  description
  status
  priority
  impactCost
  impactTimelineDays
  impactHours
  assessmentNotes
  requiresClientApproval
  requiresInternalApproval
  revisionCount
  desiredDueDate
  submittedAt
  createdAt
  updatedAt
  responseDueAt
  isOverdue
  approvals {
    id
    approverType
    status
    comment
    decidedAt
    approverName
  }
  attachments {
    ...DocumentFields
  }
}

query PortalChangeRequestList {
  portalChangeRequests {
    ...PortalChangeRequestFields
  }
  portalProjects {
    ...PortalProjectRow
  }
  me {
    contact {
      firstName
      lastName
    }
  }
}

query PortalChangeRequestDetail($id: ID!) {
  portalChangeRequest(id: $id) {
    ...PortalChangeRequestFields
  }
  portalProjects {
    id
    name
    currency
  }
}

query PortalApprovalsInbox {
  portalProjects {
    id
    name
    milestones {
      ...PortalMilestoneFields
    }
  }
  portalChangeRequests {
    id
    title
    type
    status
    updatedAt
    createdAt
    projectId
  }
  portalDocuments {
    ...DocumentFields
  }
  me {
    contact {
      firstName
      lastName
    }
  }
}

query PortalProject($id: ID!) {
  project: portalProject(id: $id) {
    ...PortalProjectRow
    phases {
      id
      name
      milestones {
        ...PortalMilestoneFields
      }
    }
    milestones {
      ...PortalMilestoneFields
    }
    documents {
      ...DocumentFields
    }
    changeRequests {
      id
      title
      status
      createdAt
      updatedAt
    }
  }
  me {
    contact {
      firstName
      lastName
    }
  }
}

query PortalOverview {
  portalCompany {
    id
    name
    status
  }
  portalProjects {
    ...PortalProjectRow
  }
  portalPendingApprovals {
    id
    entityType
    entityId
    approverType
    status
    comment
    decidedAt
  }
  portalChangeRequests {
    id
    title
    status
    projectId
    updatedAt
  }
}

query PortalProjects {
  portalProjects {
    ...PortalProjectRow
  }
}

query PortalDocuments {
  portalDocuments {
    ...DocumentFields
  }
  portalProjects {
    id
    name
  }
}

mutation PortalLogin($email: String!, $password: String!) {
  portalLogin(email: $email, password: $password) {
    accessToken
  }
}

mutation PortalLogout {
  portalLogout
}

mutation ApproveMilestone($approvalId: ID!) {
  approveMilestone(approvalId: $approvalId) {
    id
    status
    decidedAt
  }
}

mutation RequestMilestoneChanges($approvalId: ID!, $comment: String!) {
  requestMilestoneChanges(approvalId: $approvalId, comment: $comment) {
    id
    status
    comment
  }
}

mutation ResubmitChangeRequest($id: ID!) {
  resubmitChangeRequest(id: $id) {
    id
    status
    revisionCount
  }
}

mutation RequestUploadUrl(
  $entityType: String!
  $entityId: ID!
  $filename: String!
  $contentType: String!
) {
  requestUploadUrl(
    entityType: $entityType
    entityId: $entityId
    filename: $filename
    contentType: $contentType
  ) {
    uploadUrl
    uploadToken
    fileUrl
  }
}

mutation ConfirmUpload($entityType: String!, $entityId: ID!, $fileUrl: String!) {
  confirmUpload(entityType: $entityType, entityId: $entityId, fileUrl: $fileUrl) {
    ...DocumentFields
  }
}
