fragment ChangeRequestRow on ChangeRequestType {
  id
  projectId
  companyId
  title
  type
  status
  priority
  impactCost
  impactTimelineDays
  assignedPmId
  requestedByContactId
  createdAt
  updatedAt
  responseDueAt
  isOverdue
}

fragment ChangeRequestDetailFields on ChangeRequestType {
  id
  projectId
  companyId
  title
  type
  description
  status
  priority
  impactHours
  impactCost
  impactTimelineDays
  assessmentNotes
  assignedPmId
  requestedByContactId
  requiresClientApproval
  requiresInternalApproval
  revisionCount
  desiredDueDate
  submittedAt
  createdAt
  updatedAt
  responseDueAt
  isOverdue
  attachments {
    ...DocumentFields
  }
}

query ChangeRequestFormOptions {
  users {
    id
    name
    role
    jobTitle
    avatarUrl
  }
  companies {
    id
    name
  }
  projects {
    id
    name
    companyId
  }
}

query ChangeRequestQueue {
  changeRequestDashboard {
    openCount
    pendingApprovalCount
    overdueCount
    slaDays
  }
  projects {
    id
    name
    companyId
    currency
  }
  companies {
    id
    name
  }
  users {
    id
    name
    avatarUrl
  }
}

query ChangeRequestQueueCounts {
  changeRequestDashboard {
    openCount
    pendingApprovalCount
    overdueCount
  }
}

query ChangeRequestsByProject($projectId: ID!, $status: String) {
  changeRequests(projectId: $projectId, status: $status) {
    ...ChangeRequestRow
  }
}

query ChangeRequestDetail($id: ID!) {
  changeRequest(id: $id) {
    ...ChangeRequestDetailFields
    tasks {
      id
      title
      status
      assignee {
        id
        name
        avatarUrl
      }
    }
  }
  projects {
    id
    name
    companyId
    currency
  }
  companies {
    id
    name
  }
  users {
    id
    name
    role
    jobTitle
    avatarUrl
  }
}

query ChangeRequestTaskOptions($projectId: ID!) {
  project(id: $projectId) {
    id
    phases {
      id
      name
      milestones {
        id
        title
      }
    }
    tasks {
      id
      title
      parentTaskId
    }
  }
}

mutation CreateChangeRequest(
  $projectId: ID!
  $title: String!
  $type: String!
  $description: String
  $priority: String!
  $desiredDueDate: Date
) {
  createChangeRequest(
    projectId: $projectId
    title: $title
    type: $type
    description: $description
    priority: $priority
    desiredDueDate: $desiredDueDate
  ) {
    ...ChangeRequestDetailFields
  }
}

mutation AssessChangeRequest(
  $id: ID!
  $impactHours: Float
  $impactCost: Float
  $impactTimelineDays: Int
  $assessmentNotes: String
) {
  submitImpactAssessment(
    id: $id
    impactHours: $impactHours
    impactCost: $impactCost
    impactTimelineDays: $impactTimelineDays
    assessmentNotes: $assessmentNotes
  ) {
    ...ChangeRequestDetailFields
  }
}

mutation DecideChangeRequest(
  $id: ID!
  $approvalId: ID!
  $decision: String!
  $comment: String
) {
  decideChangeRequest(id: $id, approvalId: $approvalId, decision: $decision, comment: $comment) {
    ...ChangeRequestDetailFields
  }
}

mutation UpdateChangeRequestStatus($id: ID!, $toStatus: String!, $reason: String) {
  transitionChangeRequest(id: $id, toStatus: $toStatus, reason: $reason) {
    ...ChangeRequestDetailFields
  }
}

mutation AssignChangeRequest($id: ID!, $assignedPmId: ID) {
  assignChangeRequest(id: $id, assignedPmId: $assignedPmId) {
    ...ChangeRequestDetailFields
  }
}
